<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>創作支持方案｜九境書庫</title>
  <meta name="description" content="支持九境書庫的個人原創小說創作，協助網站主機、網域與創作開發維護。">
  <meta property="og:title" content="創作支持方案｜九境書庫">
  <meta property="og:description" content="九境書庫為個人原創小說創作網站。您的支持將用於網站主機維護、網域費用與創作開發。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://bluesense.tw/pages/support/index.html">
  <meta name="theme-color" content="#0f0b12">
  <link rel="icon" type="image/png" sizes="64x64" href="/images/favicon.png?v=1">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f0b12;
      --panel: rgba(255,255,255,.075);
      --panel-strong: rgba(255,255,255,.115);
      --text: #f7ecff;
      --muted: #cbbbd7;
      --line: rgba(255,255,255,.16);
      --gold: #e8c878;
      --rose: #d888b8;
      --shadow: 0 24px 70px rgba(0,0,0,.38);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 12%, rgba(216,136,184,.22), transparent 34%),
        radial-gradient(circle at 80% 0%, rgba(232,200,120,.16), transparent 32%),
        linear-gradient(180deg, #17101d 0%, var(--bg) 58%, #09070b 100%);
    }

    a { color: inherit; }

    .support-wrap {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 72px 0 56px;
    }

    .support-card {
      position: relative;
      overflow: hidden;
      padding: clamp(28px, 5vw, 52px);
      border: 1px solid var(--line);
      border-radius: 28px;
      background: linear-gradient(180deg, var(--panel-strong), var(--panel));
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .support-card::before {
      content: "";
      position: absolute;
      inset: -1px;
      pointer-events: none;
      background: linear-gradient(135deg, rgba(232,200,120,.24), transparent 36%, rgba(216,136,184,.18));
      opacity: .72;
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      padding: 1px;
      border-radius: inherit;
      -webkit-mask-composite: xor;
      mask-composite: exclude;
    }

    .kicker {
      margin: 0 0 12px;
      color: var(--gold);
      letter-spacing: .14em;
      font-size: 13px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 6vw, 52px);
      letter-spacing: .08em;
    }


    .support-hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: clamp(24px, 5vw, 54px);
      align-items: center;
    }

    .support-logo-box {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 270px;
      pointer-events: none;
    }

    .support-logo {
      width: min(300px, 100%);
      filter:
        drop-shadow(0 0 18px rgba(232,200,120,.24))
        drop-shadow(0 18px 34px rgba(0,0,0,.42));
      opacity: .96;
    }

    .intro {
      max-width: 620px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.9;
    }

    .section-title {
      margin: 36px 0 14px;
      color: var(--gold);
      font-size: 18px;
      letter-spacing: .08em;
    }

    .use-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .use-list li {
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(0,0,0,.16);
      color: #f1e6f8;
    }

    .plans {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 14px;
    }

    .plan {
      display: block;
      padding: 20px 16px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255,255,255,.07);
      text-decoration: none;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }

    .plan:hover,
    .plan:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(232,200,120,.72);
      background: rgba(255,255,255,.105);
      outline: none;
    }

    .price {
      display: block;
      margin-bottom: 8px;
      color: var(--gold);
      font-size: 24px;
      font-weight: 700;
    }

    .label {
      color: var(--text);
      font-size: 15px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 34px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 18px;
      border: 1px solid var(--line);
      border-radius: 999px;
      text-decoration: none;
      background: rgba(255,255,255,.075);
    }

    .btn.primary {
      border-color: rgba(232,200,120,.62);
      background: linear-gradient(135deg, rgba(232,200,120,.28), rgba(216,136,184,.18));
    }

    .note {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    @media (max-width: 720px) {
      .support-wrap { padding-top: 36px; }
      .support-hero { grid-template-columns: 1fr; }
      .support-logo-box {
        min-height: auto;
        margin-top: 20px;
        justify-content: flex-start;
      }
      .support-logo { width: min(220px, 70vw); }
      .plans { grid-template-columns: 1fr; }
      .actions { flex-direction: column; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <!-- 將下方綠界網址替換成你的正式付款頁網址。三個支持方案目前共用同一個付款頁。 -->
  <main class="support-wrap">
    <section class="support-card" aria-labelledby="supportTitle">
      <div class="support-hero">
        <div>
          <p class="kicker">NineSense Archive</p>
          <h1 id="supportTitle">創作支持方案</h1>

          <p class="intro">
            九境書庫是個人經營的原創劇本網站。<br>
            如果剛好有喜歡的作品，歡迎請作者喝杯飲料。<br>
            您的支持將用於網站維護、網域續費與創作更新。
          </p>
        </div>

        <div class="support-logo-box" aria-hidden="true">
          <img class="support-logo" src="/images/support-logo.png" alt="">
        </div>
      </div>

      <h2 class="section-title">您的支持將用於：</h2>
      <ul class="use-list">
        <li>網域費用</li>
        <li>網站開發與維護</li>
        <li>原創作品創作與整理</li>
      </ul>

      <h2 class="section-title">支持方案：</h2>
      <div class="plans" aria-label="支持方案列表">
        <a class="plan" href="REPLACE_WITH_ECPAY_PAYMENT_URL" target="_blank" rel="noopener">
          <span class="price">NT$50</span>
          <span class="label">小額支持</span>
        </a>
        <a class="plan" href="REPLACE_WITH_ECPAY_PAYMENT_URL" target="_blank" rel="noopener">
          <span class="price">NT$100</span>
          <span class="label">支持創作</span>
        </a>
        <a class="plan" href="REPLACE_WITH_ECPAY_PAYMENT_URL" target="_blank" rel="noopener">
          <span class="price">NT$300</span>
          <span class="label">特別支持</span>
        </a>
      </div>

      <h2 class="section-title">其他支持方式：</h2>
      <div class="plans">
        <a class="plan"
          href="https://ko-fi.com/ninesense"
          target="_blank"
          rel="noopener">
          <span class="price">☕ Ko-fi</span>
          <span class="label">使用 Ko-fi 支持創作</span>
        </a>
      </div>

      <div class="actions">
        <a class="btn primary" href="REPLACE_WITH_ECPAY_PAYMENT_URL" target="_blank" rel="noopener">前往綠界付款頁</a>
        <a class="btn" href="/ninesensearchive">返回首頁</a>
      </div>

     <!--  <p class="note">
        備註：正式上線前，請把本頁所有 <code>REPLACE_WITH_ECPAY_PAYMENT_URL</code> 換成綠界付款頁網址。
      </p> -->
    </section>
  </main>
</body>
</html>
